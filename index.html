<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Create Interactive Birthday Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600&display=swap');

  :root {
    /* Default (Rose) Theme Variables */
    --s1-bg: radial-gradient(circle at top, #fff3f8 0%, #ffcbe0 100%);
    --s2-bg: radial-gradient(circle at center, #c61156 0%, #520224 100%);
    --heart-1: #ff9bc2; 
    --heart-2: #d61c60;
    --text-highlight: #ffccd9;
    --text-accent: #ff9bc2;
    --rope-color: #7a344d;
    --dot-color: #d61c60;
  }

  body, html {
    margin: 0; padding: 0; height: 100%;
    background-color: #050505;
    display: flex; justify-content: center; align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    color: white;
  }

  /* --- CREATOR VIEW (Form) --- */
  .creator-view {
    display: none; 
    flex-direction: column;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    width: 90%;
    max-width: 400px;
    max-height: 95vh;
    overflow-y: auto;
    z-index: 10;
  }

  /* Custom Scrollbar for Form */
  .creator-view::-webkit-scrollbar { width: 5px; }
  .creator-view::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

  .creator-view h2 {
    margin-top: 0;
    font-family: 'Playfair Display', serif;
    color: #ff9bc2;
    margin-bottom: 20px;
    text-align: center;
    font-size: 22px;
  }

  .input-group { width: 100%; margin-bottom: 15px; }
  .input-group label {
    display: block; font-size: 12px; margin-bottom: 6px; color: #ccc;
  }
  
  .input-group input, .input-group textarea, .input-group select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.5); color: white;
    font-family: 'Poppins', sans-serif; font-size: 14px;
    box-sizing: border-box; outline: none; transition: 0.3s;
  }
  
  .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
    border-color: #ff9bc2;
  }

  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: linear-gradient(45deg, #d61c60, #ff9bc2);
    color: white; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: 'Poppins', sans-serif; transition: transform 0.2s;
  }
  .btn:active { transform: scale(0.98); }

  .btn-whatsapp {
    background: linear-gradient(45deg, #25D366, #128C7E);
    margin-top: 10px;
    display: flex; justify-content: center; align-items: center; gap: 8px;
  }

  .result-area {
    display: none; width: 100%; margin-top: 20px; padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .link-box {
    width: 100%; padding: 10px; background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;
    color: #aaa; font-size: 12px; margin-bottom: 15px; box-sizing: border-box;
  }

  .action-buttons { display: flex; gap: 10px; }
  .btn-outline { background: transparent; border: 1px solid #ff9bc2; color: #ff9bc2; }

  /* --- CARD VIEW --- */
  .card-container {
    display: none; 
    width: 380px; height: 650px;
    background: var(--s1-bg);
    border-radius: 35px;
    position: relative; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    max-width: 100%; max-height: 100vh;
    transition: background 0.5s;
  }

  .screen-1 {
    position: absolute; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
  }

  .sparkles { position: absolute; width: 100%; height: 100%; pointer-events: none; }
  .sparkle { position: absolute; color: var(--text-accent); opacity: 0; animation: twinkle 3s ease-in-out infinite; }
  .s1 { top: 25%; left: 25%; animation-delay: 0s; font-size: 20px; }
  .s2 { top: 22%; left: 65%; animation-delay: 1s; font-size: 15px; }
  .s3 { top: 45%; left: 75%; animation-delay: 1.5s; font-size: 18px; }
  .s4 { top: 40%; left: 20%; animation-delay: 2s; font-size: 12px; }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(20deg); filter: drop-shadow(0 0 5px var(--text-accent)); }
  }

  .top-text {
    margin-top: 90px; font-size: 16px;
    color: #444; font-style: italic; font-weight: 600;
    font-family: 'Playfair Display', serif; letter-spacing: 0.5px;
  }

  .heart-container {
    margin-top: 55px;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0px 20px 25px rgba(0, 0, 0, 0.2));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.03); }
  }

  #heartGrad stop:nth-child(1) { stop-color: var(--heart-1); }
  #heartGrad stop:nth-child(2) { stop-color: var(--heart-2); }

  .interaction-area {
    margin-top: auto; margin-bottom: 70px;
    display: flex; flex-direction: column; align-items: center; position: relative;
  }

  .handle { cursor: grab; transition: stroke 0.3s; }
  .handle:active { cursor: grabbing; }

  #pulse { animation: pulseAnim 2s infinite; transform-origin: 30px 120px; stroke: var(--dot-color); }
  @keyframes pulseAnim {
    0% { transform: scale(1); opacity: 0.8; stroke-width: 2; }
    100% { transform: scale(1.7); opacity: 0; stroke-width: 0.5; }
  }

  .instruction {
    margin-top: 30px; font-size: 11px;
    color: #555; letter-spacing: 3px;
    text-transform: uppercase; font-weight: 600;
  }

  .screen-2 {
    position: absolute; width: 100%; height: 100%;
    background: var(--s2-bg); color: white;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 1s ease 0.2s;
    z-index: 1; text-align: center;
  }

  .screen-2.active { opacity: 1; pointer-events: all; z-index: 3; }

  .tree-bg {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    opacity: 0.12; z-index: -1;
  }
  .tree-path {
    stroke-dasharray: 300; stroke-dashoffset: 300;
    transition: stroke-dashoffset 2.5s ease-out 0.8s;
  }
  .screen-2.active .tree-path { stroke-dashoffset: 0; }

  .wish-text {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 16px; margin-bottom: 15px; color: var(--text-highlight);
    opacity: 0; transform: translateY(15px); transition: all 0.8s ease 0.8s;
  }

  .receiver-text {
    font-family: 'Playfair Display', serif; font-size: 28px;
    color: #ffffff; font-weight: 600; margin-bottom: 5px;
    opacity: 0; transform: translateY(15px); transition: all 0.8s ease 1s;
  }

  .bday-text {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 50px; line-height: 1.1; margin: 0 0 15px 0;
    text-shadow: 0px 8px 15px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(15px); transition: all 0.8s ease 1.2s;
  }

  .custom-msg {
    font-size: 13px; color: var(--text-highlight); letter-spacing: 1px;
    font-weight: 400; width: 80%; line-height: 1.5;
    opacity: 0; transform: translateY(15px); transition: all 0.8s ease 1.4s;
  }

  .sender-text {
    font-family: 'Playfair Display', serif; font-size: 15px;
    color: var(--text-accent); font-style: italic; margin-top: 25px;
    opacity: 0; transform: translateY(15px); transition: all 0.8s ease 1.6s;
  }

  .made-by-text {
    position: absolute; bottom: 20px; font-size: 11px;
    color: rgba(255,255,255,0.6); letter-spacing: 1px;
    opacity: 0; transition: all 0.8s ease 2s;
  }

  .screen-2.active .wish-text, 
  .screen-2.active .receiver-text,
  .screen-2.active .bday-text, 
  .screen-2.active .custom-msg,
  .screen-2.active .sender-text,
  .screen-2.active .made-by-text {
    opacity: 1; transform: translateY(0);
  }

</style>
</head>
<body>

<!-- CREATOR FORM VIEW -->
<div class="creator-view" id="creator-view">
  <h2>Create a Special Card</h2>
  
  <div class="input-group">
    <label>Recipient's Name *</label>
    <input type="text" id="input-name" placeholder="e.g. Radhika" autocomplete="off">
  </div>
  
  <div class="input-group">
    <label>Event Date *</label>
    <input type="date" id="input-date">
  </div>

  <div class="input-group">
    <label>Custom Message</label>
    <textarea id="input-msg" rows="2" placeholder="e.g. May all your dreams come true!"></textarea>
  </div>

  <div class="input-group">
    <label>Your Name (Sender)</label>
    <input type="text" id="input-sender" placeholder="e.g. Raja Roy" autocomplete="off">
  </div>

  <div class="input-group">
    <label>Card Theme</label>
    <select id="input-theme">
      <option value="rose">Rose Pink (Default)</option>
      <option value="gold">Royal Gold</option>
      <option value="neon">Neon Night</option>
    </select>
  </div>
  
  <button class="btn" id="generate-btn">Generate Magic Link ✨</button>

  <div class="result-area" id="result-area">
    <label style="font-size: 12px; color: #ccc; margin-bottom: 5px; display:block;">Your Shareable Link:</label>
    <input type="text" class="link-box" id="generated-link" readonly>
    <div class="action-buttons">
      <button class="btn btn-outline" id="copy-btn">Copy</button>
      <button class="btn btn-outline" id="preview-btn">Preview</button>
    </div>
    <button class="btn btn-whatsapp" id="whatsapp-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Share on WhatsApp
    </button>
  </div>
</div>

<!-- ACTUAL CARD VIEW -->
<div class="card-container" id="card-view">
  <div class="screen-1" id="screen1">
    <div class="sparkles">
      <div class="sparkle s1">✨</div>
      <div class="sparkle s2">✨</div>
      <div class="sparkle s3">✨</div>
      <div class="sparkle s4">✨</div>
    </div>

    <div class="top-text">a little something, for you</div>

    <div class="heart-container">
      <svg width="130" height="130" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartGrad" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" />
            <stop offset="100%" />
          </linearGradient>
        </defs>
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#heartGrad)"/>
      </svg>
    </div>

    <div class="interaction-area">
      <svg width="60" height="180" viewBox="0 0 60 180" id="svg-coil">
        <!-- Lines styled via script based on theme -->
        <line id="string" x1="30" y1="0" x2="30" y2="120" stroke-width="2.5" stroke-dasharray="4 4" />
        <circle id="pulse" cx="30" cy="120" r="16" fill="transparent" stroke-width="2" />
        <circle id="pull-ring" class="handle" cx="30" cy="120" r="16" fill="transparent" stroke="#2c2c2c" stroke-width="4" stroke-linecap="round"/>
        <circle id="pull-ring-inner" class="handle" cx="30" cy="120" r="13" fill="transparent" stroke="#8a8a8a" stroke-width="1"/>
        <circle id="pull-dot" class="handle" cx="30" cy="106" r="4" />
      </svg>
      <div class="instruction">Pull & Release</div>
    </div>
  </div>

  <div class="screen-2" id="screen2">
    <svg class="tree-bg" width="350" height="400" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path class="tree-path" d="M50,100 Q48,70 50,50 Q45,30 30,20 M50,50 Q55,30 70,20 M45,60 Q35,45 25,45 M55,60 Q65,45 75,45 M48,35 Q40,25 35,15 M52,35 Q60,25 65,15 M25,45 Q20,35 15,35 M75,45 Q80,35 85,35" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </svg>

    <div class="wish-text">make a wish...</div>
    <div class="receiver-text" id="dynamic-name">Dear Radhika,</div>
    <div class="bday-text">Happy<br>Birthday</div>
    
    <div class="custom-msg" id="dynamic-msg">to someone worth celebrating</div>
    <div class="sender-text" id="dynamic-date">~ 03/08/2026</div>

    <div class="made-by-text" id="dynamic-sender" style="display:none;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
  // --- THEME DEFINITIONS ---
  const themes = {
    rose: {
      s1: 'radial-gradient(circle at top, #fff3f8 0%, #ffcbe0 100%)',
      s2: 'radial-gradient(circle at center, #c61156 0%, #520224 100%)',
      h1: '#ff9bc2', h2: '#d61c60',
      th: '#ffccd9', ta: '#ff9bc2',
      rope: '#7a344d', dot: '#d61c60',
      confetti: ['#ffffff', '#ff9bc2', '#d61c60']
    },
    gold: {
      s1: 'radial-gradient(circle at top, #fff9e6 0%, #ffe082 100%)',
      s2: 'radial-gradient(circle at center, #997300 0%, #332600 100%)',
      h1: '#ffd54f', h2: '#ff8f00',
      th: '#fff3e0', ta: '#ffd54f',
      rope: '#664d00', dot: '#ff8f00',
      confetti: ['#ffffff', '#ffd54f', '#ff8f00']
    },
    neon: {
      s1: 'radial-gradient(circle at top, #e0f7fa 0%, #80deea 100%)',
      s2: 'radial-gradient(circle at center, #006064 0%, #001f22 100%)',
      h1: '#18ffff', h2: '#d500f9',
      th: '#e0f7fa', ta: '#18ffff',
      rope: '#00363a', dot: '#d500f9',
      confetti: ['#18ffff', '#d500f9', '#ffffff']
    }
  };

  // --- LINK GENERATOR LOGIC ---
  const urlParams = new URLSearchParams(window.location.search);
  const paramName = urlParams.get('n');
  const paramDate = urlParams.get('d');
  const paramMsg = urlParams.get('m');
  const paramSender = urlParams.get('s');
  const paramTheme = urlParams.get('t') || 'rose';

  const creatorView = document.getElementById('creator-view');
  const cardView = document.getElementById('card-view');

  if (paramName && paramDate) {
    // Show Card View
    creatorView.style.display = 'none';
    cardView.style.display = 'block';
    
    // Apply Theme
    const root = document.documentElement;
    const activeTheme = themes[paramTheme] || themes.rose;
    root.style.setProperty('--s1-bg', activeTheme.s1);
    root.style.setProperty('--s2-bg', activeTheme.s2);
    root.style.setProperty('--heart-1', activeTheme.h1);
    root.style.setProperty('--heart-2', activeTheme.h2);
    root.style.setProperty('--text-highlight', activeTheme.th);
    root.style.setProperty('--text-accent', activeTheme.ta);
    root.style.setProperty('--dot-color', activeTheme.dot);
    
    document.getElementById('string').setAttribute('stroke', activeTheme.rope);
    document.getElementById('pull-dot').setAttribute('fill', activeTheme.dot);

    // Apply Data
    document.getElementById('dynamic-name').textContent = `Dear ${paramName},`;
    
    let formattedDate = paramDate;
    if(paramDate.includes('-')) {
        const parts = paramDate.split('-');
        formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
    }
    document.getElementById('dynamic-date').textContent = `~ ${formattedDate}`;

    if (paramMsg) {
      document.getElementById('dynamic-msg').textContent = paramMsg;
    }

    if (paramSender) {
      const senderDiv = document.getElementById('dynamic-sender');
      senderDiv.style.display = 'block';
      senderDiv.textContent = `Made with ❤️ by ${paramSender}`;
    }

    initCardLogic(activeTheme.confetti);
  } else {
    // Show Form View
    creatorView.style.display = 'flex';
    cardView.style.display = 'none';
  }

  // Button Listeners
  document.getElementById('generate-btn').addEventListener('click', () => {
    const n = document.getElementById('input-name').value.trim();
    const d = document.getElementById('input-date').value;
    const m = document.getElementById('input-msg').value.trim();
    const s = document.getElementById('input-sender').value.trim();
    const t = document.getElementById('input-theme').value;

    if (!n || !d) { alert('Name and Date are required!'); return; }

    const baseUrl = window.location.href.split('?')[0];
    let query = `?n=${encodeURIComponent(n)}&d=${encodeURIComponent(d)}&t=${t}`;
    if (m) query += `&m=${encodeURIComponent(m)}`;
    if (s) query += `&s=${encodeURIComponent(s)}`;
    
    const newUrl = baseUrl + query;
    document.getElementById('generated-link').value = newUrl;
    document.getElementById('result-area').style.display = 'block';
  });

  document.getElementById('copy-btn').addEventListener('click', () => {
    const linkInput = document.getElementById('generated-link');
    linkInput.select();
    linkInput.setSelectionRange(0, 99999);
    try {
      navigator.clipboard.writeText(linkInput.value).then(() => alert('Link Copied!'));
    } catch(err) {
      document.execCommand("copy");
      alert('Link Copied!');
    }
  });

  document.getElementById('preview-btn').addEventListener('click', () => {
    window.location.href = document.getElementById('generated-link').value;
  });

  document.getElementById('whatsapp-btn').addEventListener('click', () => {
    const link = document.getElementById('generated-link').value;
    const text = encodeURIComponent(`Hey! I made a special interactive birthday card just for you ✨ Open it here: ${link}`);
    window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
  });


  // --- INTERACTIVE CARD LOGIC ---
  function initCardLogic(confettiColors) {
    const ring = document.getElementById('pull-ring');
    const ringInner = document.getElementById('pull-ring-inner');
    const dot = document.getElementById('pull-dot');
    const string = document.getElementById('string');
    const pulse = document.getElementById('pulse');
    const screen1 = document.getElementById('screen1');
    const screen2 = document.getElementById('screen2');

    let isDragging = false;
    let startY = 0;
    const baseY = 120;
    let currentY = baseY;
    const maxY = 240; 

    const startDrag = (e) => {
      isDragging = true;
      startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      ring.style.stroke = "var(--dot-color)"; 
      if(pulse) pulse.style.display = 'none';
    };

    const moveDrag = (e) => {
      if (!isDragging) return;
      if(e.cancelable) e.preventDefault(); 
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      const deltaY = clientY - startY;
      currentY = baseY + deltaY;
      if (currentY < baseY) currentY = baseY;
      if (currentY > maxY) currentY = maxY;
      updateSVG(currentY);
    };

    const endDrag = () => {
      if (!isDragging) return;
      isDragging = false;
      ring.style.stroke = "#2c2c2c";
      if (currentY > baseY + 80) { triggerAnimation(); } 
      else { snapBack(); if(pulse) pulse.style.display = 'block'; }
    };

    function updateSVG(y) {
      ring.setAttribute('cy', y);
      ringInner.setAttribute('cy', y);
      dot.setAttribute('cy', y - 14);
      string.setAttribute('y2', y);
    }

    function snapBack() {
      let interval = setInterval(() => {
        currentY -= (currentY - baseY) * 0.25; 
        if (currentY <= baseY + 1) { currentY = baseY; clearInterval(interval); }
        updateSVG(currentY);
      }, 16);
    }

    function triggerAnimation() {
      let bounce = baseY - 20; 
      updateSVG(bounce);
      setTimeout(() => updateSVG(baseY), 100);

      screen1.style.transform = 'scale(1.5) translateY(-50px)';
      screen1.style.opacity = '0';

      setTimeout(() => {
        screen2.classList.add('active');
        fireConfetti();
      }, 400);
    }

    function fireConfetti() {
      const duration = 6000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: confettiColors, disableForReducedMotion: true });
        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: confettiColors, disableForReducedMotion: true });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }

    ring.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag, {passive: false});
    window.addEventListener('mouseup', endDrag);

    ring.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchmove', moveDrag, {passive: false});
    window.addEventListener('touchend', endDrag);
  }
</script>
</body>
