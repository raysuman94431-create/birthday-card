<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Interactive Birthday Card Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  :root {
    /* Default Theme (Rose) */
    --s1-bg: radial-gradient(circle at top, #fff3f8 0%, #ffcbe0 100%);
    --s2-bg: radial-gradient(circle at center, #c61156 0%, #520224 100%);
    --heart-1: #ff9bc2; --heart-2: #d61c60;
    --text-accent: #ffccd9; --text-main: #ffffff;
    --rope-color: #7a344d; --pulse-color: #d61c60;
  }

  .theme-gold {
    --s1-bg: radial-gradient(circle at top, #fff9e6 0%, #ffe082 100%);
    --s2-bg: radial-gradient(circle at center, #997300 0%, #332600 100%);
    --heart-1: #ffd54f; --heart-2: #ff8f00;
    --text-accent: #fff3e0; --rope-color: #664d00; --pulse-color: #ff8f00;
  }

  .theme-neon {
    --s1-bg: radial-gradient(circle at top, #e0f7fa 0%, #80deea 100%);
    --s2-bg: radial-gradient(circle at center, #006064 0%, #001f22 100%);
    --heart-1: #18ffff; --heart-2: #00838f;
    --text-accent: #18ffff; --rope-color: #00363a; --pulse-color: #18ffff;
  }

  body, html {
    margin: 0; padding: 0; height: 100%;
    background-color: #050505; color: white;
    display: flex; justify-content: center; align-items: center;
    font-family: 'Poppins', sans-serif; overflow: hidden;
  }

  /* --- GENERATOR FORM VIEW --- */
  .creator-view {
    display: none; flex-direction: column;
    background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px);
    padding: 30px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    width: 90%; max-width: 420px; max-height: 95vh; overflow-y: auto; z-index: 10;
  }
  .creator-view::-webkit-scrollbar { width: 4px; }
  .creator-view::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

  .creator-view h2 { text-align: center; font-family: 'Playfair Display', serif; color: #ff9bc2; margin: 0 0 20px 0; font-size: 24px;}
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #ddd; }
  .input-group input, .input-group textarea, .input-group select {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.4); color: white; font-family: 'Poppins', sans-serif;
    font-size: 14px; box-sizing: border-box; outline: none; transition: 0.3s;
  }
  .input-group input:focus, .input-group textarea:focus { border-color: #ff9bc2; }
  
  .btn-group { display: flex; gap: 10px; margin-top: 15px; }
  .btn {
    flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Poppins', sans-serif;
  }
  .btn-primary { background: linear-gradient(45deg, #d61c60, #ff9bc2); color: white; }
  .btn-preview { background: rgba(255,255,255,0.1); border: 1px solid #fff; color: white; }
  .btn-whatsapp { background: #25D366; color: white; width: 100%; margin-top: 10px; }
  .btn:active { transform: scale(0.96); }

  .result-area { display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
  .link-box { width: 100%; padding: 10px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; color: #aaa; font-size: 12px; margin-bottom: 10px; box-sizing: border-box; }

  /* --- ACTUAL CARD VIEW --- */
  .card-container {
    display: none; width: 380px; height: 650px;
    background: var(--s1-bg); border-radius: 35px;
    position: relative; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8); max-width: 100%; max-height: 100vh;
  }

  /* Screen 1 */
  .screen-1 {
    position: absolute; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    transition: opacity 0.6s ease, transform 0.6s ease; z-index: 2;
  }
  .sparkles { position: absolute; width: 100%; height: 100%; pointer-events: none; }
  .sparkle { position: absolute; color: var(--heart-1); opacity: 0; animation: twinkle 3s ease-in-out infinite; }
  .s1 { top: 25%; left: 25%; animation-delay: 0s; font-size: 20px; }
  .s2 { top: 22%; left: 65%; animation-delay: 1s; font-size: 15px; }
  .s3 { top: 45%; left: 75%; animation-delay: 1.5s; font-size: 18px; }
  .s4 { top: 40%; left: 20%; animation-delay: 2s; font-size: 12px; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); } 50% { opacity: 1; transform: scale(1.2) rotate(20deg); filter: drop-shadow(0 0 5px var(--heart-1)); } }

  .top-text { margin-top: 90px; font-size: 16px; color: rgba(0,0,0,0.6); font-style: italic; font-weight: 600; font-family: 'Playfair Display', serif; }
  
  .heart-container { margin-top: 55px; animation: float 4s ease-in-out infinite; filter: drop-shadow(0px 20px 25px rgba(0,0,0,0.3)); }
  @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.03); } }

  .interaction-area { margin-top: auto; margin-bottom: 70px; display: flex; flex-direction: column; align-items: center; position: relative; }
  .handle { cursor: grab; transition: stroke 0.3s; }
  .handle:active { cursor: grabbing; }
  #pulse { animation: pulseAnim 2s infinite; transform-origin: 30px 120px; }
  @keyframes pulseAnim { 0% { transform: scale(1); opacity: 0.8; stroke-width: 2; } 100% { transform: scale(1.7); opacity: 0; stroke-width: 0.5; } }
  .instruction { margin-top: 30px; font-size: 11px; color: rgba(0,0,0,0.6); letter-spacing: 3px; text-transform: uppercase; font-weight: 600; }

  /* Screen 2 */
  .screen-2 {
    position: absolute; width: 100%; height: 100%;
    background: var(--s2-bg); color: var(--text-main);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 1s ease 0.2s; z-index: 1; text-align: center;
  }
  .screen-2.active { opacity: 1; pointer-events: all; z-index: 3; }

  .tree-bg { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); opacity: 0.12; z-index: -1; }
  .tree-path { stroke-dasharray: 300; stroke-dashoffset: 300; transition: stroke-dashoffset 2.5s ease-out 0.8s; stroke: #fff;}
  .screen-2.active .tree-path { stroke-dashoffset: 0; }

  .avatar-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--text-accent); margin-bottom: 15px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); opacity: 0; transform: translateY(15px); transition: all 0.8s ease 0.6s;}
  
  .wish-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 16px; margin-bottom: 10px; color: var(--text-accent); opacity: 0; transform: translateY(15px); transition: all 0.8s ease 0.8s; }
  .receiver-text { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 600; margin-bottom: 5px; opacity: 0; transform: translateY(15px); transition: all 0.8s ease 1s; }
  .bday-text { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 55px; line-height: 1.1; margin: 0 0 15px 0; text-shadow: 0px 8px 15px rgba(0,0,0,0.5); opacity: 0; transform: translateY(15px); transition: all 0.8s ease 1.2s; }
  
  .countdown-box { font-size: 14px; font-weight: 600; background: rgba(0,0,0,0.25); padding: 8px 15px; border-radius: 10px; margin-bottom: 15px; display: none; opacity: 0; transform: translateY(15px); transition: all 0.8s ease 1.3s;}
  
  .custom-msg { font-size: 12px; color: var(--text-accent); width: 85%; line-height: 1.6; opacity: 0; transform: translateY(15px); transition: all 0.8s ease 1.4s; }
  .sender-text { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--heart-1); font-style: italic; margin-top: 25px; opacity: 0; transform: translateY(15px); transition: all 0.8s ease 1.6s; }

  .screen-2.active .avatar-img, .screen-2.active .wish-text, .screen-2.active .receiver-text, .screen-2.active .bday-text, .screen-2.active .countdown-box, .screen-2.active .custom-msg, .screen-2.active .sender-text { opacity: 1; transform: translateY(0); }

  /* Floating Back Button for Preview */
  #backToEditBtn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; border: 1px solid #fff; padding: 10px 20px; border-radius: 20px; z-index: 100; cursor: pointer; display: none; font-family: 'Poppins'; }
</style>
</head>
<body id="mainBody">

<!-- === GENERATOR FORM === -->
<div class="creator-view" id="creator-view">
  <h2>Create Magic Card ✨</h2>
  
  <div class="input-group">
    <label>Recipient's Name *</label>
    <input type="text" id="input-name" placeholder="e.g. Radhika" required>
  </div>
  
  <div class="input-group">
    <label>Date & Time (For Countdown)</label>
    <input type="datetime-local" id="input-date">
  </div>

  <div class="input-group">
    <label>Photo URL (Optional)</label>
    <input type="text" id="input-img" placeholder="Paste image link here">
  </div>

  <div class="input-group">
    <label>Custom Message</label>
    <textarea id="input-msg" rows="2" placeholder="May all your dreams come true!"></textarea>
  </div>

  <div class="input-group">
    <label>Your Name (Sender) *</label>
    <input type="text" id="input-sender" placeholder="e.g. Raja Roy" required>
  </div>

  <div class="input-group">
    <label>Card Theme</label>
    <select id="input-theme">
      <option value="theme-rose">🌸 Romantic Rose</option>
      <option value="theme-gold">👑 Luxury Gold</option>
      <option value="theme-neon">⚡ Cyber Neon</option>
    </select>
  </div>
  
  <div class="btn-group">
    <button class="btn btn-preview" onclick="previewCard()">👁️ Preview</button>
    <button class="btn btn-primary" onclick="generateLink()">✨ Generate Link</button>
  </div>

  <div class="result-area" id="result-area">
    <label style="font-size: 12px; color: #ccc; margin-bottom: 5px; display:block;">Your Shareable Link:</label>
    <input type="text" class="link-box" id="generated-link" readonly>
    <div class="btn-group" style="margin-top: 5px;">
      <button class="btn btn-preview" onclick="copyLink()">📋 Copy Link</button>
    </div>
    <button class="btn btn-whatsapp" onclick="shareWhatsApp()">💬 Share on WhatsApp</button>
  </div>
</div>

<!-- === ACTUAL CARD UI (ORIGINAL DESIGN) === -->
<div class="card-container" id="card-view">
  <!-- Screen 1: Pull String -->
  <div class="screen-1" id="screen1">
    <div class="sparkles">
      <div class="sparkle s1">✨</div>
      <div class="sparkle s2">✨</div>
      <div class="sparkle s3">✨</div>
      <div class="sparkle s4">✨</div>
    </div>
    <div class="top-text">a little something, for you</div>
    <div class="heart-container">
      <svg width="130" height="130" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartGrad" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
            <stop stop-color="var(--heart-1)" id="gradStop1"/>
            <stop offset="1" stop-color="var(--heart-2)" id="gradStop2"/>
          </linearGradient>
        </defs>
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#heartGrad)"/>
      </svg>
    </div>
    <div class="interaction-area">
      <svg width="60" height="180" viewBox="0 0 60 180" id="svg-coil">
        <line id="string" x1="30" y1="0" x2="30" y2="120" stroke="var(--rope-color)" stroke-width="2.5" stroke-dasharray="4 4" />
        <circle id="pulse" cx="30" cy="120" r="16" fill="transparent" stroke="var(--pulse-color)" stroke-width="2" />
        <circle id="pull-ring" class="handle" cx="30" cy="120" r="16" fill="transparent" stroke="#2c2c2c" stroke-width="4" stroke-linecap="round"/>
        <circle id="pull-ring-inner" class="handle" cx="30" cy="120" r="13" fill="transparent" stroke="#8a8a8a" stroke-width="1"/>
        <circle id="pull-dot" class="handle" cx="30" cy="106" r="4" fill="var(--pulse-color)" />
      </svg>
      <div class="instruction">Pull & Release</div>
    </div>
  </div>

  <!-- Screen 2: Reveal & Celebration -->
  <div class="screen-2" id="screen2">
    <svg class="tree-bg" width="350" height="400" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path class="tree-path" d="M50,100 Q48,70 50,50 Q45,30 30,20 M50,50 Q55,30 70,20 M45,60 Q35,45 25,45 M55,60 Q65,45 75,45 M48,35 Q40,25 35,15 M52,35 Q60,25 65,15 M25,45 Q20,35 15,35 M75,45 Q80,35 85,35" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </svg>
    
    <img id="dynamic-avatar" class="avatar-img" src="" alt="Avatar">
    <div class="wish-text">make a wish...</div>
    <div class="receiver-text" id="dynamic-name">Dear Radhika,</div>
    <div class="bday-text">Happy<br>Birthday</div>
    
    <div id="dynamic-timer" class="countdown-box">⏳ <span id="timerText"></span></div>
    
    <div class="custom-msg" id="dynamic-msg">to someone worth celebrating</div>
    <div class="sender-text" id="dynamic-sender">~ 03/08/2026</div>
  </div>
</div>

<button id="backToEditBtn" onclick="closePreview()">🔙 Back to Edit</button>

<script>
  // --- STATE & ROUTING ---
  const urlParams = new URLSearchParams(window.location.search);
  const paramName = urlParams.get('n');
  const paramDate = urlParams.get('d');
  const paramMsg = urlParams.get('m');
  const paramSender = urlParams.get('s');
  const paramImg = urlParams.get('img');
  const paramTheme = urlParams.get('t') || 'theme-rose';

  const creatorView = document.getElementById('creator-view');
  const cardView = document.getElementById('card-view');
  let countdownInterval;

  if (paramName && paramSender) {
    // Show Card View (Received Link)
    creatorView.style.display = 'none';
    cardView.style.display = 'block';
    setupCardData(paramName, paramDate, paramMsg, paramSender, paramImg, paramTheme);
    initPullLogic();
  } else {
    // Show Form View (Generator)
    creatorView.style.display = 'flex';
    cardView.style.display = 'none';
    
    // Live theme update in form
    document.getElementById('input-theme').addEventListener('change', (e) => {
      document.body.className = e.target.value;
    });
  }

  // --- FORM FUNCTIONS ---
  function setupCardData(n, d, m, s, img, t) {
    document.body.className = t;
    document.getElementById('dynamic-name').textContent = `Dear ${n},`;
    document.getElementById('dynamic-sender').textContent = `~ ${s}`;
    document.getElementById('dynamic-msg').textContent = m || 'to someone worth celebrating';
    
    if(img) {
      document.getElementById('dynamic-avatar').src = img;
      document.getElementById('dynamic-avatar').style.display = 'block';
    } else {
      document.getElementById('dynamic-avatar').style.display = 'none';
    }

    if(d) startCountdown(d);
  }

  function previewCard() {
    const n = document.getElementById('input-name').value || 'Name';
    const d = document.getElementById('input-date').value;
    const m = document.getElementById('input-msg').value;
    const s = document.getElementById('input-sender').value || 'Sender';
    const img = document.getElementById('input-img').value;
    const t = document.getElementById('input-theme').value;

    setupCardData(n, d, m, s, img, t);
    
    creatorView.style.display = 'none';
    cardView.style.display = 'block';
    document.getElementById('backToEditBtn').style.display = 'block';
    initPullLogic();
  }

  function closePreview() {
    // Reset Card Animation State
    document.getElementById('screen1').style.transform = 'none';
    document.getElementById('screen1').style.opacity = '1';
    document.getElementById('screen2').classList.remove('active');
    updateSVG(120); // Reset string
    if(countdownInterval) clearInterval(countdownInterval);

    cardView.style.display = 'none';
    document.getElementById('backToEditBtn').style.display = 'none';
    creatorView.style.display = 'flex';
    document.body.className = document.getElementById('input-theme').value;
  }

  function generateLink() {
    const n = document.getElementById('input-name').value.trim();
    const s = document.getElementById('input-sender').value.trim();
    if (!n || !s) return alert('Recipient Name and Sender Name are required!');

    const d = document.getElementById('input-date').value;
    const m = document.getElementById('input-msg').value.trim();
    const img = document.getElementById('input-img').value.trim();
    const t = document.getElementById('input-theme').value;

    const baseUrl = window.location.href.split('?')[0];
    let query = `?n=${encodeURIComponent(n)}&s=${encodeURIComponent(s)}&t=${t}`;
    if (d) query += `&d=${encodeURIComponent(d)}`;
    if (m) query += `&m=${encodeURIComponent(m)}`;
    if (img) query += `&img=${encodeURIComponent(img)}`;
    
    document.getElementById('generated-link').value = baseUrl + query;
    document.getElementById('result-area').style.display = 'block';
  }

  function copyLink() {
    const linkInput = document.getElementById('generated-link');
    linkInput.select();
    document.execCommand("copy");
    alert('Link Copied Successfully!');
  }

  function shareWhatsApp() {
    const link = document.getElementById('generated-link').value;
    const text = encodeURIComponent(`I made a special interactive birthday card just for you ✨ Pull the string to open it here: ${link}`);
    window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
  }

  // --- COUNTDOWN LOGIC ---
  function startCountdown(targetDateStr) {
    let targetDate = new Date(targetDateStr).getTime();
    let timerBox = document.getElementById('dynamic-timer');
    let timerText = document.getElementById('timerText');
    timerBox.style.display = 'inline-block';

    if(countdownInterval) clearInterval(countdownInterval);
    
    countdownInterval = setInterval(() => {
        let distance = targetDate - new Date().getTime();
        if (distance < 0) {
            clearInterval(countdownInterval);
            timerBox.style.display = 'none';
        } else {
            let days = Math.floor(distance / (1000 * 60 * 60 * 24));
            let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((distance % (1000 * 60)) / 1000);
            timerText.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }
    }, 1000);
  }

  // --- PULL STRING LOGIC (ORIGINAL) ---
  const ring = document.getElementById('pull-ring');
  const ringInner = document.getElementById('pull-ring-inner');
  const dot = document.getElementById('pull-dot');
  const string = document.getElementById('string');
  const pulse = document.getElementById('pulse');
  
  let isDragging = false;
  let startY = 0;
  const baseY = 120;
  let currentY = baseY;
  const maxY = 240; 

  function initPullLogic() {
    // Clear old listeners if any
    ring.removeEventListener('mousedown', startDrag);
    window.removeEventListener('mousemove', moveDrag);
    window.removeEventListener('mouseup', endDrag);
    ring.removeEventListener('touchstart', startDrag);
    window.removeEventListener('touchmove', moveDrag);
    window.removeEventListener('touchend', endDrag);

    // Add fresh listeners
    ring.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag, {passive: false});
    window.addEventListener('mouseup', endDrag);
    ring.addEventListener('touchstart', startDrag, {passive: false});
    window.
