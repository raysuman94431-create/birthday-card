<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Birthday Card for Radhika</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500&display=swap');

  body, html {
    margin: 0; padding: 0; height: 100%;
    background-color: #050505;
    display: flex; justify-content: center; align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }

  .card-container {
    width: 380px; height: 650px;
    background: radial-gradient(circle at top, #fff3f8 0%, #ffcbe0 100%);
    border-radius: 35px;
    position: relative; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8);
  }

  /* --- SCREEN 1: UI Before Pulling --- */
  .screen-1 {
    position: absolute; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
  }

  /* Animation 1: Magical Sparkles */
  .sparkles { position: absolute; width: 100%; height: 100%; pointer-events: none; }
  .sparkle { position: absolute; color: #ff6da0; opacity: 0; animation: twinkle 3s ease-in-out infinite; }
  .s1 { top: 25%; left: 25%; animation-delay: 0s; font-size: 20px; }
  .s2 { top: 22%; left: 65%; animation-delay: 1s; font-size: 15px; }
  .s3 { top: 45%; left: 75%; animation-delay: 1.5s; font-size: 18px; }
  .s4 { top: 40%; left: 20%; animation-delay: 2s; font-size: 12px; }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(20deg); filter: drop-shadow(0 0 5px #ff9bc2); }
  }

  .top-text {
    margin-top: 90px; font-size: 16px;
    color: #c24673; font-style: italic;
    font-family: 'Playfair Display', serif;
    letter-spacing: 0.5px;
  }

  /* Floating SVG Heart */
  .heart-container {
    margin-top: 55px;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0px 20px 25px rgba(255, 105, 180, 0.5));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.03); }
  }

  /* Pull Mechanism */
  .interaction-area {
    margin-top: auto; margin-bottom: 70px;
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }

  .handle { cursor: grab; transition: stroke 0.3s; }
  .handle:active { cursor: grabbing; }

  /* Animation 2: Pulse Glow on Ring */
  #pulse {
    animation: pulseAnim 2s infinite;
    transform-origin: 30px 120px;
  }
  @keyframes pulseAnim {
    0% { transform: scale(1); opacity: 0.8; stroke-width: 2; }
    100% { transform: scale(1.7); opacity: 0; stroke-width: 0.5; }
  }

  .instruction {
    margin-top: 30px; font-size: 11px;
    color: #9d5b74; letter-spacing: 3px;
    text-transform: uppercase; font-weight: 600;
  }

  /* --- SCREEN 2: The Reveal --- */
  .screen-2 {
    position: absolute; width: 100%; height: 100%;
    background: radial-gradient(circle at center, #c61156 0%, #520224 100%);
    color: white;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease 0.2s;
    z-index: 1; text-align: center;
  }

  .screen-2.active { opacity: 1; pointer-events: all; z-index: 3; }

  /* Animation 3: Live Tree Drawing */
  .tree-bg {
    position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%);
    opacity: 0.12; z-index: -1;
  }
  .tree-path {
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    transition: stroke-dashoffset 2.5s ease-out 0.8s;
  }
  .screen-2.active .tree-path {
    stroke-dashoffset: 0;
  }

  /* Staggered Text Animations */
  .wish-text {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 16px; margin-bottom: 20px; color: #ffccd9;
    opacity: 0; transform: translateY(15px);
    transition: all 0.8s ease 0.8s;
  }

  .receiver-text {
    font-family: 'Playfair Display', serif; font-size: 26px;
    color: #ffffff; font-weight: 600; margin-bottom: 5px;
    opacity: 0; transform: translateY(15px);
    transition: all 0.8s ease 1s;
  }

  .bday-text {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 55px; line-height: 1.1; margin: 0 0 15px 0;
    text-shadow: 0px 8px 15px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(15px);
    transition: all 0.8s ease 1.2s;
  }

  .bottom-text {
    font-size: 11px; color: #ffccd9; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 400;
    opacity: 0; transform: translateY(15px);
    transition: all 0.8s ease 1.4s;
  }

  .sender-text {
    font-family: 'Playfair Display', serif; font-size: 17px;
    color: #ff9bc2; font-style: italic; margin-top: 30px;
    opacity: 0; transform: translateY(15px);
    transition: all 0.8s ease 1.6s;
  }

  .screen-2.active .wish-text, 
  .screen-2.active .receiver-text,
  .screen-2.active .bday-text, 
  .screen-2.active .bottom-text,
  .screen-2.active .sender-text {
    opacity: 1; transform: translateY(0);
  }

</style>
</head>
<body>

<div class="card-container">
  
  <!-- Screen 1: Heart & String -->
  <div class="screen-1" id="screen1">
    
    <div class="sparkles">
      <div class="sparkle s1">✨</div>
      <div class="sparkle s2">✨</div>
      <div class="sparkle s3">✨</div>
      <div class="sparkle s4">✨</div>
    </div>

    <div class="top-text">a little something, for you</div>
    
    <div class="heart-container">
      <svg width="130" height="130" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartGrad" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ff9bc2"/>
            <stop offset="1" stop-color="#d61c60"/>
          </linearGradient>
        </defs>
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#heartGrad)"/>
      </svg>
    </div>
    
    <div class="interaction-area">
      <svg width="60" height="180" viewBox="0 0 60 180" id="svg-coil">
        <line id="string" x1="30" y1="0" x2="30" y2="120" stroke="#7a344d" stroke-width="2.5" stroke-dasharray="4 4" />
        
        <!-- Pulse Glow Animation -->
        <circle id="pulse" cx="30" cy="120" r="16" fill="transparent" stroke="#d61c60" stroke-width="2" />
        
        <circle id="pull-ring" class="handle" cx="30" cy="120" r="16" fill="transparent" stroke="#2c2c2c" stroke-width="4" stroke-linecap="round"/>
        <circle id="pull-ring-inner" class="handle" cx="30" cy="120" r="13" fill="transparent" stroke="#8a8a8a" stroke-width="1"/>
        <circle id="pull-dot" class="handle" cx="30" cy="106" r="4" fill="#d61c60" />
      </svg>
      <div class="instruction">Pull & Release</div>
    </div>
  </div>

  <!-- Screen 2: The Reveal with Customized Text -->
  <div class="screen-2" id="screen2">
    
    <!-- Animated Tree Drawing SVG -->
    <svg class="tree-bg" width="350" height="400" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path class="tree-path" d="M50,100 Q48,70 50,50 Q45,30 30,20 M50,50 Q55,30 70,20 M45,60 Q35,45 25,45 M55,60 Q65,45 75,45 M48,35 Q40,25 35,15 M52,35 Q60,25 65,15 M25,45 Q20,35 15,35 M75,45 Q80,35 85,35" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </svg>

    <div class="wish-text">make a wish...</div>
    
    <!-- User Requested Details -->
    <div class="receiver-text">Dear Radhika,</div>
    <div class="bday-text">Happy<br>Birthday</div>
    <div class="bottom-text">to someone worth celebrating</div>
    
    <div class="sender-text">~ 03/08/2026</div>
  </div>

</div>

<!-- Confetti Script -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
  const ring = document.getElementById('pull-ring');
  const ringInner = document.getElementById('pull-ring-inner');
  const dot = document.getElementById('pull-dot');
  const string = document.getElementById('string');
  const pulse = document.getElementById('pulse');
  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');

  let isDragging = false;
  let startY = 0;
  const baseY = 120;
  let currentY = baseY;
  const maxY = 240; 

  const startDrag = (e) => {
    isDragging = true;
    startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    ring.style.stroke = "#d61c60"; 
    
    // Drag karte hi pulse animation hide kar do
    if(pulse) pulse.style.display = 'none';
  };

  const moveDrag = (e) => {
    if (!isDragging) return;
    const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    const deltaY = clientY - startY;
    
    currentY = baseY + deltaY;
    
    if (currentY < baseY) currentY = baseY;
    if (currentY > maxY) currentY = maxY;

    updateSVG(currentY);
  };

  const endDrag = () => {
    if (!isDragging) return;
    isDragging = false;
    ring.style.stroke = "#2c2c2c";

    if (currentY > baseY + 80) {
      triggerAnimation();
    } else {
      snapBack();
      // Snap back par wapis pulse dikha do
      if(pulse) pulse.style.display = 'block';
    }
  };

  function updateSVG(y) {
    ring.setAttribute('cy', y);
    ringInner.setAttribute('cy', y);
    dot.setAttribute('cy', y - 14);
    string.setAttribute('y2', y);
  }

  function snapBack() {
    let interval = setInterval(() => {
      currentY -= (currentY - baseY) * 0.25; 
      if (currentY <= baseY + 1) {
        currentY = baseY;
        clearInterval(interval);
      }
      updateSVG(currentY);
    }, 16);
  }

  function triggerAnimation() {
    let bounce = baseY - 20; 
    updateSVG(bounce);
    setTimeout(() => updateSVG(baseY), 100);

    screen1.style.transform = 'scale(1.5) translateY(-50px)';
    screen1.style.opacity = '0';
    
    setTimeout(() => {
      screen2.classList.add('active');
      fireConfetti();
    }, 400);
  }

  function fireConfetti() {
    const duration = 6000;
    const end = Date.now() + duration;

    (function frame() {
      confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffffff', '#ff9bc2', '#d61c60'] });
      confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffffff', '#ff9bc2', '#d61c60'] });
      if (Date.now() < end) requestAnimationFrame(frame);
    }());
  }

  ring.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);

  ring.addEventListener('touchstart', startDrag, {passive: false});
  window.addEventListener('touchmove', moveDrag, {passive: false});
  window.addEventListener('touchend', endDrag);
</script>
</body>
</html>
